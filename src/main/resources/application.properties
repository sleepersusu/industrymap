spring.application.name=industrymap-backend

# 帳密不落設定檔（見 CLAUDE.md「禁止事項」）：由專案根目錄的 .env 提供，該檔不進版控。
# [.properties] 是副檔名提示，讓 Spring Boot 以 properties 格式解析 .env；optional: 表示檔案不存在也能啟動。
spring.config.import=optional:file:.env[.properties]

# 環境變數／.env 皆可覆寫，兩者都沒有時才用預設值。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/industrymap}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
