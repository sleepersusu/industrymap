spring.application.name=industrymap-backend

# 帳密不落設定檔（見 CLAUDE.md「禁止事項」）：由專案根目錄的 .env 提供，該檔不進版控。
# [.properties] 是副檔名提示，讓 Spring Boot 以 properties 格式解析 .env；optional: 表示檔案不存在也能啟動。
spring.config.import=optional:file:.env[.properties]

# 環境變數／.env 皆可覆寫，兩者都沒有時才用預設值。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/industrymap}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 代理初始化改為批次：Item / Company 的 @Id 標在欄位上，Hibernate 無法在代理上攔截 identifier getter，
# 連讀主鍵都會觸發初始化，於是每回一筆資料就多送一次 SELECT。設定值一次以 IN 撈齊。
# 熱路徑另有 @EntityGraph 精準處理（永遠一次 join fetch，不受此值影響），這裡是兜底，
# 也是 native query 的唯一解——Hibernate 不會對 native query 套用 @EntityGraph。
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
